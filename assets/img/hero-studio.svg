<svg xmlns="http://www.w3.org/2000/svg" viewBox="62 70 590 296" width="590" height="296">
  <!-- GDUXI hero graphic: the studio mark (GD) beside a website window and a phone (UXI). -->
  <defs>
    <linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#045FEA"/><stop offset=".5" stop-color="#8549FF"/><stop offset="1" stop-color="#D75FFF"/></linearGradient>
    <linearGradient id="hb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3F3D9E"/><stop offset=".6" stop-color="#5A48B8"/><stop offset="1" stop-color="#7158C6"/></linearGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#2F2560" flood-opacity=".16"/></filter>
    <filter id="sh2" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2F2560" flood-opacity=".18"/></filter>
  </defs>

  <!-- GD: the studio mark -->
  <g transform="rotate(-6 200 205)">
    <rect x="110" y="115" width="180" height="180" rx="50" fill="url(#mk)" filter="url(#sh)"/>
    <path d="M150.5 229.75C166.25 173.5 186.5 166.75 197.75 198.25C206.75 225.25 222.5 238.75 251.75 178" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
    <circle cx="251.75" cy="178" r="11.5" fill="#fff"/>
  </g>

  <!-- UXI: website window -->
  <g filter="url(#sh)">
    <rect x="330" y="88" width="270" height="226" rx="18" fill="#fff"/>
  </g>
  <rect x="330.5" y="88.5" width="269" height="225" rx="17.5" fill="none" stroke="#E2DEEC"/>
  <circle cx="348" cy="105" r="3.5" fill="#D8CEF5"/><circle cx="360" cy="105" r="3.5" fill="#B5D0FF"/><circle cx="372" cy="105" r="3.5" fill="#FFE08F"/>
  <rect x="390" y="99" width="124" height="12" rx="6" fill="#F4F1FA"/>
  <rect x="344" y="122" width="242" height="96" rx="12" fill="url(#hb)"/>
  <rect x="360" y="140" width="112" height="10" rx="5" fill="#fff"/>
  <rect x="360" y="157" width="80" height="8" rx="4" fill="#fff" fill-opacity=".7"/>
  <rect x="360" y="182" width="64" height="20" rx="10" fill="#FFBE2E"/>
  <!-- the same mark, now living on the website -->
  <path d="M528.4 184.8C534 164.8 541.2 162.4 545.2 173.6C548.4 183.2 554 188 564.4 166.4" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="564.4" cy="166.4" r="4.5" fill="#FFBE2E"/>
  <g>
    <rect x="344" y="232" width="74" height="66" rx="10" fill="#EEF4FF"/><rect x="354" y="242" width="54" height="26" rx="6" fill="#B5D0FF"/><rect x="354" y="278" width="40" height="6" rx="3" fill="#D3DCF0"/>
    <rect x="428" y="232" width="74" height="66" rx="10" fill="#F5F2FD"/><rect x="438" y="242" width="54" height="26" rx="6" fill="#D8CEF5"/><rect x="438" y="278" width="40" height="6" rx="3" fill="#E2DEEC"/>
    <rect x="512" y="232" width="74" height="66" rx="10" fill="#FFF9EB"/><rect x="522" y="242" width="54" height="26" rx="6" fill="#FFE08F"/><rect x="522" y="278" width="40" height="6" rx="3" fill="#F0E4C6"/>
  </g>
  <!-- cursor on the call to action -->
  <path transform="translate(410 190)" d="M0 0V23L6 17.5L10.5 27L14.5 25L10 15.5H18Z" fill="#1D1933" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- phone -->
  <g filter="url(#sh2)"><rect x="560" y="196" width="74" height="146" rx="16" fill="#fff"/></g>
  <rect x="561" y="197" width="72" height="144" rx="15" fill="none" stroke="#1D1933" stroke-width="2"/>
  <rect x="585" y="205" width="24" height="4" rx="2" fill="#1D1933"/>
  <rect x="569" y="217" width="56" height="46" rx="8" fill="url(#hb)"/>
  <path d="M578 252C581 241 585 240 587 246C589 251 592 254 598 243" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <rect x="569" y="272" width="46" height="6" rx="3" fill="#E2DEEC"/>
  <rect x="569" y="284" width="32" height="6" rx="3" fill="#E2DEEC"/>
  <rect x="569" y="300" width="38" height="13" rx="6.5" fill="#FFBE2E"/>
  <rect x="569" y="320" width="56" height="12" rx="6" fill="#F5F2FD"/>

</svg>
