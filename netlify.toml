[build]
  publish = "."

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# The Android app's source code lives in this repo but isn't part of the website.
[[redirects]]
  from = "/android/*"
  to = "/404"
  status = 404
  force = true

# Same for the iPhone app's source code.
[[redirects]]
  from = "/ios/*"
  to = "/404"
  status = 404
  force = true
